<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280">
          <defs>
            <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#2e1065" />
              <stop offset="45%" stop-color="#4a044e" />
              <stop offset="100%" stop-color="#030712" />
            </linearGradient>
            <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ec4899" />
              <stop offset="50%" stop-color="#38bdf8" />
              <stop offset="100%" stop-color="#ec4899" />
            </linearGradient>
            <radialGradient id="glow" cx="30%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#ec4899" stop-opacity="0.35" />
              <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.15" />
              <stop offset="100%" stop-color="#000000" stop-opacity="0" />
            </radialGradient>
            <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
              <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.7"/>
            </filter>
            <filter id="frameGlow" x="-10%" y="-10%" width="120%" height="120%">
              <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ec4899" flood-opacity="0.4"/>
            </filter>
          </defs>
          <rect width="720" height="1280" fill="url(#bgGrad)" />
          <rect width="720" height="1280" fill="url(#glow)" />
          
            <!-- Top Google Flow Brand Bar -->
            <g transform="translate(57.6, 50)">
              <rect x="0" y="0" width="230" height="34" rx="17" fill="#ec4899" />
              <text x="115" y="22" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="900" font-size="11" text-anchor="middle" letter-spacing="1">🚀 NANO BANANA PRO • 4K CINEMATIC</text>
              <rect x="240" y="0" width="130" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
              <text x="305" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="800" font-size="11" text-anchor="middle">9:16 SHORTS</text>
            </g>

            

            <!-- Bottom Content Group -->
            <g transform="translate(57.6, 832)" filter="url(#shadow)">
              <rect x="-10" y="-10" width="624.8" height="350" rx="20" fill="#020617" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
              
              <rect x="15" y="18" width="150" height="26" rx="6" fill="#f59e0b" />
              <text x="90" y="36" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="900" font-size="11" text-anchor="middle">KEM TIVI 3D PIXAR</text>
              
              <text x="15" y="86" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="32">
                Pi &amp; Kem Hoạt Hình
              </text>
              
              <text x="15" y="120" fill="#fde047" font-family="system-ui, sans-serif" font-weight="700" font-size="16">
                ✨ Tết Trung Thu Gia Đình
              </text>

              <text x="15" y="152" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-style="italic">
                Pi va Kem mua lan
              </text>

              <!-- Technical metadata bar -->
              <line x1="15" y1="180" x2="589.8" y2="180" stroke="#334155" stroke-width="1" />
              <text x="15" y="205" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="11">MODEL: Nano Banana Pro</text>
              <text x="15" y="225" fill="#64748b" font-family="monospace" font-size="10">SEED: #838773 • RATIO: 9:16 (720x1280) • CFG: 7.5</text>
              <text x="15" y="245" fill="#64748b" font-family="monospace" font-size="10">ENGINE: Google Flow Latent Diffusion v2.4</text>

              <rect x="15" y="265" width="574.8" height="46" rx="12" fill="#ef4444" />
              <text x="302.4" y="294" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="15" text-anchor="middle">▶ XEM NGAY TRÊN SHORTS & REELS</text>
            </g>
          
        </svg>