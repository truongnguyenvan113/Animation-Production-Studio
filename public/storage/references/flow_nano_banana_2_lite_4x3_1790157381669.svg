<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
          <defs>
            <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#0c2340" />
              <stop offset="45%" stop-color="#164e63" />
              <stop offset="100%" stop-color="#030712" />
            </linearGradient>
            <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#0ea5e9" />
              <stop offset="50%" stop-color="#38bdf8" />
              <stop offset="100%" stop-color="#ec4899" />
            </linearGradient>
            <radialGradient id="glow" cx="30%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.35" />
              <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.15" />
              <stop offset="100%" stop-color="#000000" stop-opacity="0" />
            </radialGradient>
            <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
              <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.7"/>
            </filter>
            <filter id="frameGlow" x="-10%" y="-10%" width="120%" height="120%">
              <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#0ea5e9" flood-opacity="0.4"/>
            </filter>
          </defs>
          <rect width="1200" height="900" fill="url(#bgGrad)" />
          <rect width="1200" height="900" fill="url(#glow)" />
          
            <!-- Top Google Flow Brand Bar -->
            <g transform="translate(60, 40)">
              <rect x="0" y="0" width="280" height="34" rx="17" fill="#0ea5e9" />
              <text x="140" y="22" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="900" font-size="12" text-anchor="middle" letter-spacing="1">⚡ NANO BANANA 2 LITE • FAST FLOW</text>
              <rect x="290" y="0" width="160" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
              <text x="370" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="800" font-size="12" text-anchor="middle">GOOGLE FLOW DIRECTOR</text>
            </g>

            

            <!-- Left Main Content Group -->
            <g transform="translate(60, 252.00000000000003)" filter="url(#shadow)">
              <rect x="-10" y="-10" width="480" height="540" rx="20" fill="#020617" fill-opacity="0.80" stroke="#334155" stroke-width="1" />

              <rect x="15" y="16" width="180" height="28" rx="8" fill="#f59e0b" />
              <text x="105" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="900" font-size="12" text-anchor="middle" letter-spacing="1">KEM TIVI OFFICIAL 4K</text>
              
              <text x="15" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="30">
                Pi &amp; Kem Hoạt Hình
              </text>
              
              <text x="15" y="132" fill="#fde047" font-family="system-ui, sans-serif" font-weight="700" font-size="18">
                ✨ Hài hước vui nhộn
              </text>

              <text x="15" y="166" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-style="italic">
                Kem cười vui nhộn
              </text>

              <!-- Technical metadata bar -->
              <line x1="15" y1="195" x2="456" y2="195" stroke="#334155" stroke-width="1" />
              <text x="15" y="218" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="11">MODEL: Nano Banana 2 Lite</text>
              <text x="15" y="238" fill="#64748b" font-family="monospace" font-size="10">RATIO: 4:3 (1200x900) • SEED: #162843 • CFG: 7.5</text>
              <text x="15" y="256" fill="#64748b" font-family="monospace" font-size="10">STYLE: 3D Pixar Stylized • LIGHTING: Volumetric Cinematic Lighting</text>

              <rect x="15" y="280" width="220" height="42" rx="12" fill="#ef4444" />
              <text x="125" y="307" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="14" text-anchor="middle">XEM NGAY • FULL HD</text>
            </g>
          
        </svg>