      (function() {

          if (originalFetch) {
            var boundFetch = originalFetch.bind(window);

                },
                configurable: true,
                enumerable: true
              });
            } catch (e) {}

            if (typeof Window !== 'undefined' && Window.prototype) {
              try {
                var desc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
                if (desc && !desc.set && desc.configurable) {
                  Object.defineProperty(Window.prototype, 'fetch', {
                    get: function() {
                      return boundFetch;
                    },
                    set: function(fn) {
                      boundFetch = typeof fn === 'function' ? fn.bind(window) : fn;
                    },
                    configurable: true,
                    enumerable: true
                  });
                }
              } catch (e) {}
            }
          }
        } catch (err) {
          console.warn('Fetch setter compatibility setup skipped:', err);
